name: Prospec-B2B CI

on:
  push:
    branches: [main]
    paths:
      - 'Comercial/Prospec-B2B/**'
      - '.github/workflows/prospec-b2b-ci.yml'
  pull_request:
    paths:
      - 'Comercial/Prospec-B2B/**'
      - '.github/workflows/prospec-b2b-ci.yml'

defaults:
  run:
    working-directory: Comercial/Prospec-B2B

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Comercial/Prospec-B2B/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
